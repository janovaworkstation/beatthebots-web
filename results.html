    .jump-to-you-btn {

  <script src="/js/config.js"></script>
  <script src="/js/scoring.js"></script>
  <script>
    const DISPLAY_NAMES = { 'GPT-5.2': 'GPT-4o' };
    function dName(raw) { return DISPLAY_NAMES[raw] || raw; }

    const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const GAME_NAMES = {
      wordle: 'Wordle',
      connections: 'Connections',
      strands: 'Strands',
      keyword: 'Keyword'
    };

    function fmtDate(iso) {
      if (!iso) return '—';
      const [y, m, d] = iso.split('-').map(Number);
      return `${MONTHS[m-1]} ${d}, ${y}`;
    }

    function getDayName(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return DAYS[new Date(y, m - 1, d).getDay()];
    }

    function ptsClass(pts) {
      if (pts == null) return '';
      if (pts >= 8) return 'score-good';
      if (pts >= 6) return 'score-ok';
      return 'score-bad';
    }

    function gameScore(gameKey, r) {
      const norm = (typeof BTBScoring !== 'undefined') ? BTBScoring.normalizeGame(gameKey, r) : r;
      const pts = norm && norm.points != null ? norm.points : null;

      if (gameKey === 'wordle') {
        if (r.solved) return { text: `${r.attempts_used}/6`, cls: ptsClass(pts) };
        return { text: 'X/6', cls: 'score-bad' };
      }
      if (gameKey === 'connections') {
        if (r.solved && r.attempts_used != null) {
          return { text: `${r.attempts_used}`, cls: ptsClass(pts) };
        }
        if (r.solved) return { text: 'Solved ✓', cls: ptsClass(pts) };
        return { text: 'Failed ✗', cls: 'score-bad' };
      }
      if (gameKey === 'strands') {
        if (r.solved) return { text: 'Solved ✓', cls: 'score-good' };
        if ((pts || 0) > 0) return { text: `${pts} pts`, cls: ptsClass(pts) };
        return { text: 'Failed ✗', cls: 'score-bad' };
      }
      if (gameKey === 'keyword') {
        if (!r.solved) return { text: 'Failed', cls: 'score-bad' };
        return { text: `${pts} pts`, cls: ptsClass(pts) };
      }
      return { text: '—', cls: '' };
    }

    function publisherLabel(pub) {
      if (pub === 'NYT') return 'New York Times';
      if (pub === 'WaPo') return 'Washington Post';
      return pub;
    }

    function parseURLPath() {
      const path = window.location.pathname;
      const match = path.match(/^\/results\/(\d{4}-\d{2}-\d{2})\/(wordle|connections|strands|keyword)\/?$/);
      if (!match) return null;
      return { date: match[1], game: match[2] };
    }

    function updateMetaTags(gameName, gameDate) {
      const title = `${gameName} Results — ${fmtDate(gameDate)} | Beat the Bots Daily`;
      const description = `See how Claude, GPT-4o, Gemini, Grok, and Kimi performed in ${gameName} on ${fmtDate(gameDate)}.`;
      const url = `https://www.beatthebotsdaily.com${window.location.pathname}`;

      document.getElementById('page-title').textContent = title;
      document.getElementById('page-description').setAttribute('content', description);
      document.getElementById('og-title').setAttribute('content', title);
      document.getElementById('og-description').setAttribute('content', description);
      document.getElementById('og-url').setAttribute('content', url);
      document.getElementById('twitter-title').setAttribute('content', title);
      document.getElementById('twitter-description').setAttribute('content', description);
    }

    function renderGameResult(gameKey, gameData, date, totalGames) {
      if (!gameData || !gameData.results) {
        return '<div class="error-state"><strong>No results found</strong>This game has no data for the selected date</div>';
      }

      const gameName = GAME_NAMES[gameKey] || gameKey;
      
      // Sort results by normalized points descending, then by attempts ascending (for tiebreaking)
      const sortedResults = [...gameData.results]
        .map(r => {
          const norm = BTBScoring.normalizeGame(gameKey, r);
          return { ...r, normalizedPoints: norm?.points ?? 0 };
        })
        .sort((a, b) => {
          // Primary: points descending
          if (b.normalizedPoints !== a.normalizedPoints) {
            return b.normalizedPoints - a.normalizedPoints;
          }
          // Tiebreaker: attempts ascending (lower attempts = better rank)
          const aAttempts = a.attempts_used ?? Infinity;
          const bAttempts = b.attempts_used ?? Infinity;
          return aAttempts - bAttempts;
        });

      // Compute competition ranks (1224 style: tied scores share rank, next rank skips)
      const ranks = [];
      let currentRank = 1;
      for (let i = 0; i < sortedResults.length; i++) {
        if (i > 0) {
          const prev = sortedResults[i - 1];
          const curr = sortedResults[i];
          // Check if this result is tied with the previous one
          if (curr.normalizedPoints === prev.normalizedPoints && 
              (curr.attempts_used ?? null) === (prev.attempts_used ?? null)) {
            // Same rank as previous
            ranks.push(ranks[i - 1]);
          } else {
            // New rank: current position + 1 (1-indexed)
            currentRank = i + 1;
            ranks.push(currentRank);
          }
        } else {
          ranks.push(currentRank);
        }
      }

      // Find human row
      const humanIdx = sortedResults.findIndex(r => r.provider === 'Human' || r.model_name === 'jlusenhop');
      const humanRank = humanIdx >= 0 ? ranks[humanIdx] : null;

      const rows = sortedResults.map((r, idx) => {
        const rank = ranks[idx];
        const sc = gameScore(gameKey, r);
        const isHuman = r.provider === 'Human' || r.model_name === 'jlusenhop';
        
        let badge = '';
        if (r.winner && !r.tied) badge = `<span class="winner-badge">Winner</span>`;
        else if (r.winner && r.tied) badge = `<span class="winner-badge">Tied</span>`;

        return `<div class="result-row ${isHuman ? 'human-row' : ''}" ${isHuman ? 'id="human-result-row"' : ''}>
          <div class="result-left">
            <div class="result-rank">#${rank} of ${sortedResults.length}</div>
            <div class="result-model">
              <div class="dot" style="background:${r.accent_color}"></div>
              ${dName(r.model_name)}${badge}
            </div>
          </div>
          <div class="result-score ${sc.cls}">${sc.text}</div>
        </div>`;
      }).join('');

      const youStickyBar = humanRank 
        ? `<div class="you-sticky-bar">You're #${humanRank} of ${sortedResults.length}</div>`
        : '';

      const viewAllLink = totalGames > 1 
        ? `<a href="/today" class="view-all-link">View all four games →</a>`
        : '';

      return `
        <div class="game-result-header">
          <div class="game-title">${gameName}</div>
          <div class="game-meta">${publisherLabel(gameData.publisher)}</div>
        </div>
        <div class="card bracketed" style="padding:20px;">
          ${youStickyBar}
          ${rows}
        </div>
        ${viewAllLink}
      `;
    }

    async function loadGameResult() {
      const params = parseURLPath();
      if (!params) {
        document.getElementById('game-results-container').innerHTML = `
          <div class="error-state">
            <strong>Invalid URL</strong>
            Please use the format: /results/YYYY-MM-DD/game
          </div>`;
        return;
      }

      const { date, game } = params;
      const gameName = GAME_NAMES[game] || game;

      document.getElementById('result-day').textContent = getDayName(date);
      document.getElementById('result-date').textContent = fmtDate(date);
      document.getElementById('game-name-title').textContent = gameName;
      document.getElementById('result-label').textContent = fmtDate(date);

      updateMetaTags(gameName, date);

      try {
        const data = await apiFetch(`/api/results/${date}`);
        const gameData = data.games[game];
        const totalGames = Object.keys(data.games).length;
        
        if (!gameData) {
          document.getElementById('game-results-container').innerHTML = `
            <div class="error-state">
              <strong>Game not found</strong>
              No ${gameName} results available for ${fmtDate(date)}
            </div>`;
          return;
        }

        document.getElementById('game-results-container').innerHTML = 
          renderGameResult(game, gameData, date, totalGames);

        // Auto-scroll to human row and setup jump button
        setupHumanRowScroll();
      } catch (err) {
        document.getElementById('game-results-container').innerHTML = `
          <div class="error-state">
            <strong>Results unavailable</strong>
            Unable to load ${gameName} results for ${fmtDate(date)}
          </div>`;
      }
    }

    function setupHumanRowScroll() {
      const humanRow = document.getElementById('human-result-row');
      if (!humanRow) return;

      // Create jump button
      const jumpBtn = document.createElement('button');
      jumpBtn.className = 'jump-to-you-btn';
      jumpBtn.textContent = 'You ↑';
      jumpBtn.onclick = () => {
        humanRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      };
      document.body.appendChild(jumpBtn);

      // Scroll to human row on load
      setTimeout(() => {
        humanRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }, 100);

      // Show/hide jump button based on scroll position
      function updateJumpBtnVisibility() {
        const rect = humanRow.getBoundingClientRect();
        const isVisible = rect.top >= 64 && rect.bottom <= window.innerHeight;
        
        if (isVisible) {
          jumpBtn.classList.remove('visible');
        } else {
          jumpBtn.classList.add('visible');
        }
      }

      window.addEventListener('scroll', updateJumpBtnVisibility);
      window.addEventListener('resize', updateJumpBtnVisibility);
      
      // Initial check
      setTimeout(updateJumpBtnVisibility, 200);
    }

    loadGameResult();
  </script>
